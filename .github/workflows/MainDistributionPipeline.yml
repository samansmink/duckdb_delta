#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: samansmink/extension-ci-tools/.github/workflows/_extension_distribution.yml@c06aab6a6a989507eb32c4d513b395e5ddca6338
    secrets: inherit # required for writing to vcpkg binary cache
    with:
      # Main config
      duckdb_version: 51bbf8224c # latest main as of now
      ci_tools_version: c06aab6a6a989507eb32c4d513b395e5ddca6338
      extension_name: delta
      enable_rust: true
      rust_logs: true
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;'

      # Config to write vcpkg binary cache
      extra_toolchains: ${{ github.event_name != 'pull_request' && ';downgraded_aws_cli;python3;' || 'python3' }}
      save_cache: ${{ github.event_name != 'pull_request' }}
      vcpkg_binary_sources: ${{ github.event_name != 'pull_request' && vars.VCPKG_BINARY_SOURCES || '' }}


      override_ci_tools_repository: samansmink/extension-ci-tools
      reduced_ci_mode: enabled


  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: samansmink/extension-ci-tools/.github/workflows/_extension_deploy.yml@c06aab6a6a989507eb32c4d513b395e5ddca6338
    secrets: inherit
    with:
      extension_name: delta
      duckdb_version: 51bbf8224c # latest main as of now
      ci_tools_version: c06aab6a6a989507eb32c4d513b395e5ddca6338
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      override_ci_tools_repository: samansmink/extension-ci-tools
      reduced_ci_mode: enabled